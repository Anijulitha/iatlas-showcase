[pytest]
testpaths = tests
python_files = test_*.py *_test.py smoke_test.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short
markers =
    smoke: tests que requieren DB y servicios externos
    golden: tests contra PDFs reales (regresión)
    scorecard: tests de métricas globales de precisión
